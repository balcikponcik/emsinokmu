<style>
/* Layout: tek ekranlık parti oyunu — başlık, kategori çipleri, ortada kart destesi, altta OK / NOK düğmeleri ve skor */
:root {
  --bg: #F1ECF4;
  --fg: #1F1430;
  --muted: #6E6080;
  --card: #FFFFFF;
  --card-edge: #E2D8EA;
  --sticker: #FFD43B;
  --logo: #1F5EFF;
  --logo-fg: #FFFFFF;
  --sticker-fg: #1F1430;
  --ok: #17905F;
  --ok-soft: #DDF3E8;
  --nok: #D93450;
  --nok-soft: #FBE1E6;
  --chip: #E5DCEC;
  --special-bg: #FFF4C7;
  --special-edge: #F2C21B;
  --shadow: 0 18px 40px -18px rgba(50, 20, 80, .35);
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150E1F; --fg: #F4EEF9; --muted: #A898B8; --card: #231833; --card-edge: #36274A;
    --sticker: #FFD43B; --logo: #4A80FF; --logo-fg: #FFFFFF; --sticker-fg: #1F1430; --ok: #3CCB8E; --ok-soft: #173A2C; --nok: #FF5C78; --nok-soft: #43182A;
    --chip: #2C2040; --special-bg: #3A2F12; --special-edge: #E0B21A; --shadow: 0 18px 40px -18px rgba(0,0,0,.7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150E1F; --fg: #F4EEF9; --muted: #A898B8; --card: #231833; --card-edge: #36274A;
  --sticker: #FFD43B; --logo: #4A80FF; --logo-fg: #FFFFFF; --sticker-fg: #1F1430; --ok: #3CCB8E; --ok-soft: #173A2C; --nok: #FF5C78; --nok-soft: #43182A;
  --chip: #2C2040; --special-bg: #3A2F12; --special-edge: #E0B21A; --shadow: 0 18px 40px -18px rgba(0,0,0,.7); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 4px; }
.sticker {
  align-self: flex-start; font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .06em;
  background: var(--logo); color: var(--logo-fg); padding: 4px 12px 5px; border-radius: 8px; transform: rotate(-4deg); box-shadow: 3px 3px 0 color-mix(in srgb, var(--logo) 35%, transparent);
}
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8vw, 44px); line-height: .95; letter-spacing: -.02em; text-wrap: balance; }
h1 .ok { color: var(--ok); } h1 .nok { color: var(--nok); }
.score { display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; display: flex; gap: 6px; align-items: baseline; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.nok { background: var(--nok-soft); color: var(--nok); }
.pill b { font-family: var(--display); font-size: 17px; }

.cats { background: var(--card); border: 1.5px solid var(--card-edge); border-radius: 16px; }
.cats summary {
  list-style: none; cursor: pointer; padding: 11px 14px; display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 700; border-radius: 16px;
}
.cats summary::-webkit-details-marker { display: none; }
.cats summary .sum { flex: 1; min-width: 0; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cats summary .arrow { flex: none; width: 9px; height: 9px; border-right: 2px solid var(--fg); border-bottom: 2px solid var(--fg); transform: translateY(-2px) rotate(45deg); transition: transform .2s; }
.cats[open] summary .arrow { transform: translateY(2px) rotate(225deg); }
.cats summary:focus-visible { outline: 3px solid var(--sticker); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
.chip {
  flex: none; max-width: 100%; border: 1.5px solid transparent; background: var(--chip); color: var(--fg); font: 500 13px var(--body);
  border-radius: 999px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.chip:focus-visible, button:focus-visible { outline: 3px solid var(--sticker); outline-offset: 2px; }

.stage { position: relative; height: clamp(320px, 52vh, 400px); }
.ghost, .card {
  position: absolute; inset: 0; border-radius: 26px; background: var(--card); border: 1.5px solid var(--card-edge);
}
.ghost.g1 { transform: rotate(3.5deg) translateY(6px); opacity: .65; }
.ghost.g2 { transform: rotate(-2.5deg) translateY(3px); opacity: .85; }
.card {
  box-shadow: var(--shadow); padding: 22px 22px 20px; display: flex; flex-direction: column; justify-content: space-between;
  touch-action: pan-y; user-select: none; cursor: grab; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;
}
.card.special { background: var(--special-bg); border: 2.5px solid var(--special-edge); }
.card.special .cat { background: var(--sticker); color: var(--sticker-fg); }
.card.dragging { transition: none; cursor: grabbing; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.cat { font-weight: 700; color: var(--fg); background: var(--chip); padding: 5px 10px; border-radius: 999px; }
.num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; }
.q { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 6.4vw, 32px); line-height: 1.12; letter-spacing: -.01em; text-wrap: balance; margin: 0; }
.prompt { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.stamp {
  position: absolute; top: 34%; left: 50%; font-family: var(--display); font-weight: 800; font-size: 64px; letter-spacing: .04em;
  border: 6px solid currentColor; border-radius: 14px; padding: 0 18px; opacity: 0; pointer-events: none;
  transform: translate(-50%, -50%) rotate(-12deg) scale(1.3); transition: opacity .15s, transform .2s;
}
.stamp.ok { color: var(--ok); } .stamp.nok { color: var(--nok); transform: translate(-50%, -50%) rotate(10deg) scale(1.3); }
.stamp.show { opacity: .95; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
.stamp.nok.show { transform: translate(-50%, -50%) rotate(10deg) scale(1); }

.start, .end { text-align: left; justify-content: center; gap: 14px; cursor: default; }
.start p, .end p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 40ch; }
.big { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 7vw, 34px); line-height: 1.05; margin: 0; text-wrap: balance; }
.bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--chip); }
.bar span { display: block; height: 100%; }

.actions { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
.btn {
  border: 0; border-radius: 18px; font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: .02em;
  padding: 16px 10px; cursor: pointer; transition: transform .1s;
}
.btn:active { transform: scale(.96); }
.btn.nok { background: var(--nok); color: #fff; }
.btn.ok { background: var(--ok); color: #fff; }
.btn.skip { background: var(--chip); color: var(--fg); font-size: 14px; font-family: var(--body); font-weight: 700; padding-inline: 16px; }
.btn.draw { grid-column: 1 / -1; background: var(--fg); color: var(--bg); }
.btn:disabled { opacity: .35; cursor: default; }
.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.foot button { background: none; border: 0; color: var(--muted); font: 500 13px var(--body); text-decoration: underline; cursor: pointer; padding: 0; }
.flags { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.redflag, .greenflag {
  min-width: 0; border: 2.5px solid var(--nok); background: var(--nok-soft); color: var(--nok); border-radius: 18px;
  font-family: var(--display); font-weight: 800; font-size: clamp(15px, 4.4vw, 19px); letter-spacing: .04em; padding: 12px 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; transition: transform .1s;
}
.greenflag { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.redflag:active, .greenflag:active { transform: scale(.97); }
.redflag .cnt, .greenflag .cnt { font-family: var(--body); font-size: 12px; font-weight: 700; background: var(--nok); color: #fff; border-radius: 999px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.greenflag .cnt { background: var(--ok); }
.party {
  position: fixed; inset: 0; z-index: 100; overflow: hidden; display: grid; place-items: center; cursor: pointer;
  background: radial-gradient(circle at 50% 45%, #2fd68f 0%, #0d8a55 45%, #03331f 100%);
}
.party[hidden] { display: none; }
.rays {
  position: absolute; width: 220vmax; height: 220vmax; top: 50%; left: 50%; margin: -110vmax 0 0 -110vmax; pointer-events: none;
  background: repeating-conic-gradient(rgba(255,255,255,.16) 0deg 10deg, rgba(255,255,255,0) 10deg 24deg);
  animation: spin 9s linear infinite;
}
.party .glow { position: absolute; width: 70vmin; height: 70vmin; border-radius: 50%; background: radial-gradient(circle, rgba(220,255,235,.55), rgba(220,255,235,0) 65%); animation: breathe 1.2s ease-in-out infinite alternate; }
@keyframes breathe { from { transform: scale(.85); } to { transform: scale(1.1); } }
.confetti { position: absolute; bottom: -40px; font-size: 26px; pointer-events: none; animation: rise linear forwards; }
@keyframes rise { to { transform: translateY(-115vh) rotate(var(--r, 360deg)); opacity: .2; } }
.party-text { position: relative; z-index: 1; text-shadow: 0 1px 4px rgba(0,40,20,.6); text-align: center; color: #fff; display: flex; flex-direction: column; gap: 10px; align-items: center; padding-inline: 16px; }
.party-text b { font-family: var(--display); font-weight: 800; font-size: clamp(50px, 15vw, 104px); line-height: .9; letter-spacing: .02em; text-shadow: 0 4px 0 #075c37, 0 0 40px rgba(180,255,210,.9); animation: bounce .6s ease-in-out infinite alternate; }
.party-text span { font-size: 15px; opacity: .9; }
.party-text .flag { font-size: 64px; animation: wave .4s ease-in-out infinite alternate; transform-origin: bottom left; }
@keyframes bounce { from { transform: translateY(0) scale(1); } to { transform: translateY(-10px) scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .rays, .party .glow, .party-text b, .party-text .flag, .confetti { animation: none !important; } .confetti { display: none; } }
.siren {
  position: fixed; inset: 0; z-index: 100; overflow: hidden; display: grid; place-items: center; cursor: pointer;
  background: #2a0006; animation: flash .5s steps(1) infinite;
}
.siren[hidden] { display: none; }
@keyframes flash { 0% { background: #2a0006; } 50% { background: #8a0014; } }
.beam {
  position: absolute; width: 260vmax; height: 260vmax; top: 50%; left: 50%; margin: -130vmax 0 0 -130vmax; pointer-events: none;
  background: conic-gradient(from 0deg, rgba(255,40,60,.85) 0deg, rgba(255,40,60,0) 28deg, rgba(255,40,60,0) 180deg, rgba(255,40,60,.85) 180deg, rgba(255,40,60,0) 208deg, rgba(255,40,60,0) 360deg);
  mix-blend-mode: screen; animation: spin 1s linear infinite;
}
.beam.b1 { left: 0%; top: 0%; }
.beam.b2 { left: 100%; top: 0%; animation-direction: reverse; animation-duration: .8s; }
@keyframes spin { to { transform: rotate(360deg); } }
.lamp { position: absolute; top: calc(env(safe-area-inset-top, 0px) - 30px); width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #fff 0 18%, #ff2a3d 40%, rgba(255,42,61,0) 70%); animation: pulse .25s ease-in-out infinite alternate; }
.lamp.l1 { left: -30px; } .lamp.l2 { right: -30px; animation-delay: .12s; }
@keyframes pulse { to { transform: scale(1.35); opacity: .7; } }
.siren-text { position: relative; text-align: center; color: #fff; display: flex; flex-direction: column; gap: 10px; align-items: center; padding-inline: 16px; }
.siren-text b { font-family: var(--display); font-weight: 800; font-size: clamp(54px, 16vw, 110px); line-height: .9; letter-spacing: .02em; text-shadow: 0 0 24px #ff2a3d, 0 0 60px #ff2a3d; animation: shake .12s linear infinite; }
.siren-text span { font-size: 15px; opacity: .85; }
.siren-text .flag { font-size: 64px; animation: wave .4s ease-in-out infinite alternate; transform-origin: bottom left; }
@keyframes shake { 0% { transform: translate(-2px, 1px) rotate(-1deg); } 50% { transform: translate(2px, -1px) rotate(1deg); } 100% { transform: translate(-1px, 2px) rotate(0); } }
@keyframes wave { to { transform: rotate(-14deg); } }
@media (prefers-reduced-motion: reduce) { .siren, .beam, .lamp, .siren-text b, .siren-text .flag { animation: none !important; } .siren { background: #8a0014; } }
.keys { display: none; } @media (hover: hover) { .keys { display: inline; } }
@media (prefers-reduced-motion: reduce) { .card, .stamp, .btn { transition: none !important; } }
</style>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="sticker">EMSİ</span>
      <h1><span class="ok">Ok mu?</span> <span class="nok">Nok mu?</span></h1>
    </div>
    <div class="score" aria-live="polite">
      <span class="pill ok">OK <b id="okN">0</b></span>
      <span class="pill nok">NOK <b id="nokN">0</b></span>
    </div>
  </header>

  <details class="cats" id="catsBox">
    <summary><span>Kategoriler</span><span class="sum" id="catSum">Hepsi</span><span class="arrow" aria-hidden="true"></span></summary>
    <div class="chips" id="chips" role="group" aria-label="Kategoriler"></div>
  </details>

  <div class="stage" id="stage">
    <div class="ghost g1"></div>
    <div class="ghost g2"></div>
    <div class="card start" id="card"></div>
  </div>

  <div class="actions" id="actions"></div>

  <div class="flags">
    <button type="button" class="redflag" id="redFlag">🚩 RED FLAG <span class="cnt" id="rfN">0</span></button>
    <button type="button" class="greenflag" id="greenFlag">💚 GREEN FLAG <span class="cnt" id="gfN">0</span></button>
  </div>

  <div class="siren" id="siren" hidden role="alert" aria-label="Red flag alarmı">
    <div class="beam b1"></div><div class="beam b2"></div>
    <div class="lamp l1"></div><div class="lamp l2"></div>
    <div class="siren-text"><div class="flag">🚩</div><b>RED<br>FLAG!</b><span>Kapatmak için dokun</span></div>
  </div>

  <div class="party" id="party" hidden role="alert" aria-label="Green flag kutlaması">
    <div class="rays"></div><div class="glow"></div>
    <div id="confettiBox"></div>
    <div class="party-text"><div class="flag">💚</div><b>GREEN<br>FLAG!</b><span>Bu bir onay! Kapatmak için dokun</span></div>
  </div>

  <div class="foot">
    <span id="left"></span>
    <span class="keys">Klavye: ← NOK · → OK · boşluk atla · R red flag · G green flag</span>
    <button type="button" id="reset">Desteyi baştan karıştır</button>
  </div>
</div>

// global card numbers 1..N
let n = 0;
const ALL = [];
CATS.forEach(c => c.items.forEach(q => ALL.push({ id: ++n, cat: c.id, catName: c.name, q })));

const $ = id => document.getElementById(id);
const card = $("card"), actions = $("actions");
let selected = new Set(CATS.map(c => c.id));
let deck = [], current = null, ok = 0, nok = 0, played = 0, skipped = 0, total = 0, started = false;
let specials = [], sinceSpecial = 0, nextSpecialAt = 20;
const nextGap = () => 18 + Math.floor(Math.random() * 5);

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildDeck() {
  deck = shuffle(ALL.filter(x => selected.has(x.cat)));
  total = deck.length; ok = 0; nok = 0; played = 0; skipped = 0; current = null;
  specials = shuffle(SPECIAL.map(q => ({ special: true, catName: SPECIAL_NAME, q })));
  sinceSpecial = 0; nextSpecialAt = nextGap();
  updateScore();
}

function renderChips() {
  const all = selected.size === CATS.length;
  const html = [`<button type="button" class="chip" id="chip-all" aria-pressed="${all}">Hepsi · ${ALL.length}</button>`]
    .concat(CATS.map(c => `<button type="button" class="chip" id="chip-${c.id}" data-id="${c.id}" aria-pressed="${!all && selected.has(c.id)}">${c.name} · ${c.items.length}</button>`));
  $("chips").innerHTML = html.join("");
  $("catSum").textContent = all ? `Hepsi · ${ALL.length} kart` : CATS.filter(c => selected.has(c.id)).map(c => c.name.replace(/^\S+\s/, "")).join(", ");
}

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const all = selected.size === CATS.length;
  if (!b.dataset.id) selected = new Set(CATS.map(c => c.id));
  else {
    const id = b.dataset.id;
    if (all) selected = new Set([id]);
    else if (selected.has(id)) { selected.delete(id); if (!selected.size) selected = new Set(CATS.map(c => c.id)); }
    else selected.add(id);
  }
  renderChips(); buildDeck(); started ? draw() : showStart();
});

function updateScore() {
  $("okN").textContent = ok; $("nokN").textContent = nok;
  $("left").textContent = `${Math.max(total - played, 0)} / ${total} kart kaldı`;
}

    <p>Aşk, arkadaşlık, iş yeri, akrabalar, futbol, spor, siyaset ve gündelik hayat karışık geliyor. Sadece bazılarını oynamak için yukarıdaki Kategoriler menüsünü aç.</p>
    <p>Kartı çek, soruyu yüksek sesle oku, herkes aynı anda “OK!” ya da “NOK!” diye bağırsın. Çoğunluk kazanır, azınlık kendini savunur.</p>
    <p>Kartı sağa kaydır OK, sola kaydır NOK. Arada bir sarı kart gelirse: Ahmet’in çapkınlık dosyası açıldı demektir.</p>`;
  actions.innerHTML = `<button type="button" class="btn draw" id="drawBtn">Kart çek</button>`;
  $("drawBtn").onclick = () => { started = true; draw(); };
}

function showEnd() {
  current = null;
  const t = ok + nok || 1, okP = Math.round(ok / t * 100);
  const verdict = ok === nok ? "Tam ortadan ikiye bölündünüz." : ok > nok ? "Bu masa her şeye OK diyor. Bayağı rahatsınız." : "NOK’lar kazandı. Bu masada standartlar yüksek.";
  card.className = "card end";
  card.style.transform = ""; card.style.opacity = "";
  card.innerHTML = `<p class="big">Deste bitti!</p>
    <div class="bar" aria-hidden="true"><span style="width:${okP}%;background:var(--ok)"></span><span style="width:${100 - okP}%;background:var(--nok)"></span></div>
    <p><b style="color:var(--ok)">${ok} OK</b> · <b style="color:var(--nok)">${nok} NOK</b> · ${skipped} atlandı</p>
    <p>${verdict}</p>`;
  actions.innerHTML = `<button type="button" class="btn draw" id="againBtn">Yeniden karıştır</button>`;
  $("againBtn").onclick = () => { buildDeck(); draw(); };
}

function draw() {
  if (!deck.length) { showEnd(); return; }
  if (sinceSpecial >= nextSpecialAt && !specials.length) specials = shuffle(SPECIAL.map(q => ({ special: true, catName: SPECIAL_NAME, q })));
  if (sinceSpecial >= nextSpecialAt) {
    current = specials.pop(); sinceSpecial = 0; nextSpecialAt = nextGap();
  } else { current = deck.pop(); sinceSpecial++; }
  card.className = current.special ? "card special" : "card";
  card.style.transition = "none";
  card.style.transform = "translateY(24px) scale(.96)"; card.style.opacity = "0";
  card.innerHTML = `<div class="card-top"><span class="cat">${current.catName}</span><span class="num">${current.special ? "ÖZEL" : "#" + String(current.id).padStart(3, "0")}</span></div>
    <p class="q">${current.q}</p>
    <div class="prompt"><span>← NOK</span><span>Ok mu? Nok mu?</span><span>OK →</span></div>
    <span class="stamp ok" id="stOk">OK</span><span class="stamp nok" id="stNok">NOK</span>`;
  void card.offsetWidth;
  card.style.transition = ""; card.style.transform = ""; card.style.opacity = "";
  actions.innerHTML = `<button type="button" class="btn nok" id="nokBtn">NOK</button>
    <button type="button" class="btn skip" id="skipBtn">Atla</button>
    <button type="button" class="btn ok" id="okBtn">OK</button>`;
  $("nokBtn").onclick = () => decide("nok");
  $("okBtn").onclick = () => decide("ok");
  $("skipBtn").onclick = () => decide("skip");
  updateScore();
}

let busy = false;
function decide(v) {
  if (!current || busy) return;
  busy = true;
  if (!current.special) played++;
  if (v === "ok") ok++; else if (v === "nok") nok++; else skipped++;
  updateScore();
  const st = v === "ok" ? $("stOk") : v === "nok" ? $("stNok") : null;
  if (st) st.classList.add("show");
  const dx = v === "ok" ? 520 : v === "nok" ? -520 : 0;
  setTimeout(() => {
    card.style.transform = v === "skip" ? "translateY(-40px) scale(.94)" : `translateX(${dx}px) rotate(${dx / 20}deg)`;
    card.style.opacity = "0";
    setTimeout(() => { busy = false; draw(); }, 300);
  }, st ? 380 : 0);
}

// swipe
let sx = null, dxNow = 0;
card.addEventListener("pointerdown", e => {
  if (!current || busy) return;
  sx = e.clientX; dxNow = 0; card.classList.add("dragging"); card.setPointerCapture(e.pointerId);
});
card.addEventListener("pointermove", e => {
  if (sx === null) return;
  dxNow = e.clientX - sx;
  card.style.transform = `translateX(${dxNow}px) rotate(${dxNow / 18}deg)`;
  const a = Math.min(Math.abs(dxNow) / 110, 1);
  $("stOk").style.opacity = dxNow > 0 ? a : 0;
  $("stNok").style.opacity = dxNow < 0 ? a : 0;
});
function endDrag() {
  if (sx === null) return;
  sx = null; card.classList.remove("dragging");
  $("stOk").style.opacity = ""; $("stNok").style.opacity = "";
  if (dxNow > 100) decide("ok");
  else if (dxNow < -100) decide("nok");
  else card.style.transform = "";
}
card.addEventListener("pointerup", endDrag);
card.addEventListener("pointercancel", endDrag);

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (!started && (e.key === " " || e.key === "Enter")) { e.preventDefault(); started = true; draw(); return; }
  if (!current) return;
  if (e.key === "ArrowRight") decide("ok");
  else if (e.key === "ArrowLeft") decide("nok");
  else if (e.key === " ") { e.preventDefault(); decide("skip"); }
});

// RED FLAG
let rf = 0, sirenTimer = null, audio = null, sirenNodes = null;
function stopSiren() {
  clearTimeout(sirenTimer); $("siren").hidden = true;
  if (sirenNodes) { try { sirenNodes.forEach(n => n.stop()); } catch (e) {} sirenNodes = null; }
}
function siren() {
  rf++; $("rfN").textContent = rf;
  stopSiren(); if (typeof stopParty === "function") stopParty();
  $("siren").hidden = false;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime, dur = 2.6;
    const osc = audio.createOscillator(), lfo = audio.createOscillator(), lfoGain = audio.createGain(), g = audio.createGain();
    osc.type = "sawtooth"; osc.frequency.value = 900;
    lfo.type = "triangle"; lfo.frequency.value = 2.2; lfoGain.gain.value = 350;
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.05);
    g.gain.setValueAtTime(0.12, t + dur - 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(audio.destination);
    osc.start(t); lfo.start(t); osc.stop(t + dur); lfo.stop(t + dur);
    sirenNodes = [osc, lfo];
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200, 100, 400]); } catch (e) {}
  sirenTimer = setTimeout(stopSiren, 2800);
}
$("redFlag").onclick = siren;
$("siren").onclick = stopSiren;
document.addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") siren(); else if (e.key === "Escape") stopSiren(); });

// GREEN FLAG
let gf = 0, partyTimer = null;
function stopParty() { clearTimeout(partyTimer); $("party").hidden = true; $("confettiBox").innerHTML = ""; }
function greenFlag() {
  gf++; $("gfN").textContent = gf;
  stopSiren(); stopParty();
  const box = $("confettiBox"), bits = ["💚", "✅", "🌿", "✨", "🟢", "💚", "🍀"];
  let html = "";
  for (let i = 0; i < 34; i++) {
    const left = Math.random() * 100, dur = 2 + Math.random() * 1.6, delay = Math.random() * .9, size = 18 + Math.random() * 22, r = (Math.random() * 720 - 360) | 0;
    html += `<span class="confetti" style="left:${left}%;font-size:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;--r:${r}deg">${bits[i % bits.length]}</span>`;
  }
  box.innerHTML = html;
  $("party").hidden = false;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = t0 + i * 0.13;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + (i === 5 ? 0.7 : 0.22));
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + 0.75);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([60, 60, 60]); } catch (e) {}
  partyTimer = setTimeout(stopParty, 3000);
}
$("greenFlag").onclick = greenFlag;
$("party").onclick = stopParty;
document.addEventListener("keydown", e => { if (e.key === "g" || e.key === "G") greenFlag(); else if (e.key === "Escape") stopParty(); });

$("reset").onclick = () => { buildDeck(); started ? draw() : showStart(); };

renderChips(); buildDeck(); showStart();
</script>
